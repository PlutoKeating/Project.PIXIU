name: pixiu-kylin-v11-native

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kylin-native-package
  cancel-in-progress: false

jobs:
  native-sdk-package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, kylin-v11]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/submodules
      - name: Validate source and target
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          . /etc/os-release
          [[ "${ID,,} ${NAME,,}" == *kylin* ]]
          test "${VERSION_ID#[vV]}" = 11
          test "$(dpkg --print-architecture)" = amd64
          test "$(python3 -c 'import sys; print(sys.implementation.cache_tag)')" = cpython-312
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Provision native build dependencies
        run: sudo bash build/release/scripts/provision-target.sh kylin-v11-native-x86_64 --with-build-deps
      - name: Create isolated build environment
        run: |
          python3 -m venv "$RUNNER_TEMP/pixiu-native-venv"
          "$RUNNER_TEMP/pixiu-native-venv/bin/python" -m pip install \
            -r backend/requirements.txt -r backend/foundation/requirements-sync.txt \
            -r backend/requirements-build.txt
          echo "$RUNNER_TEMP/pixiu-native-venv/bin" >> "$GITHUB_PATH"
      - name: Governance and deterministic regression
        env:
          PIXIU_EMBEDDING: portable
          PIXIU_VECTOR_STORE: portable
        run: |
          make -C build/release governance
          python -m pytest backend/foundation/tests backend/engine/tests integrations/kylin_agent/tests -q
      - name: Rebuild Agent and verify offline supply chain
        run: bash build/release/scripts/prepare-native-supply-chain.sh
      - name: Build strict native package
        env:
          PIXIU_PROFILE: kylin-v11-native-x86_64
          PIXIU_PYTHON: ${{ runner.temp }}/pixiu-native-venv/bin/python
          PIXIU_BUNDLE_WHEELS: "1"
          PIXIU_SKIP_TESTS: "0"
        run: make -C build/release build-deb
      - name: Install and activate user services
        shell: bash
        run: |
          deb="$(realpath build/release/out/pixiu_*.deb)"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$deb"
          pixiu-user-setup --prepare-only
          systemctl --user daemon-reload
          systemctl --user restart pixiu-backend.service
          pixiu-agent-integrate --quiet
          test "$(stat -c '%a' "${XDG_CONFIG_HOME:-$HOME/.config}/pixiu/pixiu.env")" = 600
          test "$(systemctl --user is-active pixiu-backend.service)" = active
      - name: Verify installed identity and true SDK lifecycle
        run: |
          python build/release/scripts/native-sdk-smoke.py \
            --deb "$(realpath build/release/out/pixiu_*.deb)" \
            --expected-commit "$GITHUB_SHA" \
            --output build/release/out/kylin-native-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: pixiu-kylin-v11-native-${{ github.sha }}
          path: |
            build/release/out/*.deb
            build/release/out/*.sha256
            build/release/out/kylin-native-evidence.json
          if-no-files-found: error
