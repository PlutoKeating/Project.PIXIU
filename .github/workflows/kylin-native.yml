name: pixiu-kylin-v11-native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sdk-package:
    runs-on: [self-hosted, linux, x64, kylin-v11]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify immutable sources and clean checkout
        run: make -C build/release governance

      - name: Verify Kylin V11 platform
        shell: bash
        run: |
          os_id="$(. /etc/os-release; printf '%s %s' "${ID:-}" "${NAME:-}")"
          os_major="$(. /etc/os-release; printf '%s' "${VERSION_ID%%.*}")"
          [[ "${os_id,,}" == *kylin* ]]
          test "${os_major}" = "11"

      - name: Provision native build dependencies
        run: >-
          sudo bash build/release/scripts/provision-target.sh
          kylin-v11-native-x86_64 --with-build-deps

      - name: Create isolated Python build environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/pixiu-native-venv"
          "${RUNNER_TEMP}/pixiu-native-venv/bin/python" -m pip install \
            -r backend/requirements.txt \
            -r backend/foundation/requirements-sync.txt \
            -r backend/requirements-build.txt

      - name: Run deterministic backend regression
        env:
          PIXIU_EMBEDDING: portable
          PIXIU_VECTOR_STORE: portable
        run: >-
          "${RUNNER_TEMP}/pixiu-native-venv/bin/python" -m pytest
          backend/foundation/tests backend/engine/tests -q

      - name: Build strict native package
        env:
          PIXIU_PROFILE: kylin-v11-native-x86_64
          PIXIU_PYTHON: ${{ runner.temp }}/pixiu-native-venv/bin/python
          PIXIU_BUNDLE_WHEELS: "1"
          PIXIU_SKIP_TESTS: "0"
        run: make -C build/release build-deb

      - name: Install package and enable strict SDK runtime
        shell: bash
        run: |
          deb="$(realpath build/release/out/pixiu_*.deb)"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${deb}"
          sudo sed -i \
            -e 's/^PIXIU_EMBEDDING=.*/PIXIU_EMBEDDING=kylin/' \
            -e 's/^PIXIU_VECTOR_STORE=.*/PIXIU_VECTOR_STORE=kylin/' \
            /etc/pixiu/pixiu.env
          sudo systemctl restart pixiu-backend.service

      - name: Verify true SDK write and retrieval
        run: >-
          "${RUNNER_TEMP}/pixiu-native-venv/bin/python"
          build/release/scripts/native-sdk-smoke.py
          --output build/release/out/kylin-native-evidence.json

      - name: Upload native package and sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: pixiu-kylin-v11-native-${{ github.sha }}
          path: |
            build/release/out/*.deb
            build/release/out/*.sha256
            build/release/out/kylin-native-evidence.json
          if-no-files-found: error
