name: pixiu-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/submodules

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/foundation/requirements-sync.txt

      - name: Verify immutable sources and repository state
        run: |
          XDG_CONFIG_HOME="$RUNNER_TEMP/external-config" \
          XDG_STATE_HOME="$RUNNER_TEMP/external-state" \
          HERMES_HOME="$RUNNER_TEMP/external-agent" \
            bash build/release/tests/test-agent-integration.sh
          make -C build/release governance

  backend-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/submodules

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/foundation/requirements-sync.txt

      - name: Install backend dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/foundation/requirements-sync.txt

      - name: Run backend tests
        env:
          PIXIU_EMBEDDING: portable
          PIXIU_VECTOR_STORE: portable
        run: python -m pytest backend/foundation/tests backend/engine/tests integrations/kylin_agent/tests -q

      - name: Generate three-node protocol evidence
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          mkdir -p build/release/out
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")" \
            python -m backend.foundation.eval.sync_evidence \
              --root . \
              --output build/release/out/sync-protocol-evidence.json
          python - <<'PY'
          import json
          import os

          with open("build/release/out/sync-protocol-evidence.json", encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["status"] == "passed"
          assert report["release_commit"] == os.environ["GITHUB_SHA"]
          assert report["final_device_evidence"] is False
          assert len(report["nodes"]) == 3
          assert len({node["logical_view_digest"] for node in report["nodes"]}) == 1
          assert all(scenario["passed"] for scenario in report["scenarios"])
          PY

      - name: Upload three-node protocol evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: pixiu-sync-protocol-evidence-${{ github.sha }}
          path: build/release/out/sync-protocol-evidence.json
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: ./.github/actions/submodules

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build dpkg-dev python3 \
            qtbase5-dev libqt5websockets5-dev libqt5svg5-dev libqrencode-dev \
            qtwebengine5-dev qtmultimedia5-dev zlib1g-dev pkg-config

      - name: Verify portable desktop adapter and embedded management
        env:
          PIXIU_KYSDK: "OFF"
        run: |
          bash build/release/tests/test-desktop-adapter.sh
          cmake -S frontend/management -B build/release/out/management-tests -G Ninja -DPIXIU_MANAGEMENT_TESTS=ON
          cmake --build build/release/out/management-tests --parallel 2
          ctest --test-dir build/release/out/management-tests --output-on-failure

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/foundation/requirements-sync.txt

      - name: Verify Qt memory editing against the real portable backend
        run: python frontend/management/tests/run-memory-edit-live.py build/release/out/management-tests/t_memory_edit_live

      - name: Build and audit the complete generic Agent distribution
        env:
          PIXIU_KYSDK: "OFF"
        run: bash build/release/scripts/prepare-agent-supply-chain.sh

      - name: Preserve audited generic Agent distribution
        uses: actions/upload-artifact@v7
        with:
          name: pixiu-generic-agent-${{ github.sha }}
          path: build/release/evidence/agent-supply-chain/
          if-no-files-found: error

      - name: Compile, test, and package
        env:
          PIXIU_PROFILE: generic-ubuntu
          PIXIU_BUNDLE_WHEELS: "1"
          PIXIU_SKIP_TESTS: "0"
        run: make -C build/release build-deb

      - name: Verify package component manifest
        shell: bash
        run: |
          deb="$(realpath build/release/out/*.deb)"
          manifest="$(mktemp)"
          trap 'rm -f "${manifest}"' EXIT
          dpkg-deb --fsys-tarfile "${deb}" \
            | tar -xOf - ./usr/share/pixiu/release-manifest.json \
            > "${manifest}"
          package_root="$(mktemp -d)"
          trap 'rm -f "${manifest}"; rm -rf "${package_root}"' EXIT
          dpkg-deb --extract "${deb}" "${package_root}"
          test ! -e "${package_root}/usr/bin/pixiu-frontend"
          test -x "${package_root}/usr/bin/kylin-agent"
          test -x "${package_root}/usr/bin/kylin-agent-runtime"
          test -s "${package_root}/usr/lib/pixiu/launch-agent.py"
          grep -q 'exec /usr/lib/pixiu/venv/bin/python /usr/lib/pixiu/launch-agent.py' "${package_root}/usr/bin/pixiu"
          test -s "${package_root}/usr/lib/pixiu/agent-runtime/runtime-cp312.lock"
          test -s "${package_root}/usr/lib/systemd/user/kylin-agent-runtime-gateway.service"
          grep -qx 1 "${package_root}/usr/share/pixiu/agent-bundled"
          grep -qx 'Exec=pixiu' "${package_root}/usr/share/applications/com.kylin.pixiu.desktop"
          ! grep -q pixiu-frontend "${package_root}/usr/bin/pixiu"
          python3 -m venv "${package_root}/verify-venv"
          "${package_root}/verify-venv/bin/pip" install --no-index \
            --find-links="${package_root}/usr/lib/pixiu/wheels" \
            -r "${package_root}/usr/lib/pixiu/backend/requirements.txt" \
            -r "${package_root}/usr/lib/pixiu/backend/foundation/requirements-sync.txt"
          "${package_root}/verify-venv/bin/pip" install --no-index \
            --find-links="${package_root}/usr/lib/pixiu/agent-runtime/wheelhouse" \
            --require-hashes -r "${package_root}/usr/lib/pixiu/agent-runtime/runtime-cp312.lock"
          "${package_root}/verify-venv/bin/pip" check
          "${package_root}/verify-venv/bin/python" -c 'import runpy, sys; runpy.run_path(sys.argv[1], run_name="pixiu_launch_import_check")' "${package_root}/usr/lib/pixiu/launch-agent.py"
          python3 - "${manifest}" "${GITHUB_SHA}" \
            "$(dpkg-deb --field "${deb}" Version)" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["build"]["git_commit"] == sys.argv[2]
          assert manifest["product"]["debian_version"] == sys.argv[3]
          assert manifest["build"]["architecture"] == "amd64"
          assert manifest["build"]["profile"] == "generic-ubuntu"
          assert manifest["build"]["kysdk"] == "OFF"
          assert manifest["build"]["install_strict"] is False
          assert manifest["build"]["source_tree_clean"] is True
          assert manifest["provider"]["version"] == manifest["product"]["version"]
          assert manifest["sdk_sources"]["embedding"]["required_in_profile"] is False
          assert manifest["sdk_sources"]["vector_engine"]["required_in_profile"] is False
          PY

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: pixiu-deb-${{ github.sha }}
          path: |
            build/release/out/*.deb
            build/release/out/*.sha256
          if-no-files-found: error
