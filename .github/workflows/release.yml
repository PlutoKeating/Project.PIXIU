name: pixiu-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release identity
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
  portable-gate:
    needs: validate
    uses: ./.github/workflows/ci.yml
  native-build:
    needs: validate
    uses: ./.github/workflows/kylin-native.yml
  publish-release:
    needs: [portable-gate, native-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pixiu-kylin-v11-native-${{ github.sha }}
          path: build/release/out
      - name: Verify native package evidence
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          path = Path("build/release/scripts/native-sdk-smoke.py")
          spec = importlib.util.spec_from_file_location("native_smoke", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          report = json.loads(Path("build/release/out/kylin-native-evidence.json").read_text())
          module.validate_evidence(report)
          package = report["candidate_package"]
          deb = Path("build/release/out") / package["filename"]
          assert hashlib.sha256(deb.read_bytes()).hexdigest() == package["sha256"]
          assert report["release"]["git_commit"] == os.environ["GITHUB_SHA"]
          PY
      - name: Sign release checksum
        env:
          PIXIU_RELEASE_SIGNING_KEY: ${{ secrets.PIXIU_RELEASE_SIGNING_KEY }}
        run: |
          test -n "${PIXIU_RELEASE_SIGNING_KEY}"
          key="$(mktemp)"
          trap 'rm -f "${key}"' EXIT
          chmod 600 "${key}"
          printf '%s\n' "${PIXIU_RELEASE_SIGNING_KEY}" > "${key}"
          checksum="$(realpath build/release/out/*.deb.sha256)"
          PIXIU_SIGNING_KEY_FILE="${key}" \
            build/release/scripts/sign-release.sh "${checksum}"
          deb="${checksum%.sha256}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != *-* ]]; then
            channel=production
          else
            channel=staging
          fi
          manifest="${deb%.deb}.assets.json"
          python build/release/scripts/generate-artifact-manifest.py \
            --deb "${deb}" --checksum "${checksum}" \
            --signature "${checksum}.sig" \
            --public-key build/release/keys/pixiu-release-ed25519.pub \
            --channel "${channel}" \
            --output "${manifest}"
          (
            cd "$(dirname "${manifest}")"
            sha256sum "$(basename "${manifest}")" \
              > "$(basename "${manifest}").sha256"
          )
          PIXIU_SIGNING_KEY_FILE="${key}" \
            build/release/scripts/sign-release.sh "${manifest}.sha256"


      - name: Archive signed candidate
        uses: actions/upload-artifact@v7
        with:
          name: pixiu-signed-${{ github.sha }}
          path: build/release/out/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            银河麒麟 OS V11 amd64 严格原生安装包（KYSDK=ON，CPython 3.12）。
            包含 PIXIU 控制台/记忆引擎、KylinAgent 宿主、锁定 Runtime wheelhouse、
            MemoryProvider、系统云模型桥接、双 SDK 扩展及许可证/对应源码。
            由 GitHub Actions 从标签提交重建；安装并验证当前桌面用户服务后签名发布。
            Debian 通用画像是独立 CI 兼容性检查，不是本 Release 的严格原生包。
            本次产品发布不代表三台物理设备、完整业务场景与赛事最终性能验收全部完成。
          files: |
            build/release/out/*.deb
            build/release/out/*.sha256
            build/release/out/*.sha256.sig
            build/release/out/*.assets.json
            build/release/out/kylin-native-evidence.json
