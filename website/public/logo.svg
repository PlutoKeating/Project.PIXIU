<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PIXIU 应用图标：三个互联节点代表去中心化记忆网络。 -->
  <defs>
    <linearGradient id="pixiu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFD"/>
      <stop offset="1" stop-color="#1F5FD6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#pixiu-bg)"/>
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="104" y1="108" x2="152" y2="108"/>
    <line x1="104" y1="108" x2="128" y2="152"/>
    <line x1="152" y1="108" x2="128" y2="152"/>
  </g>
  <circle cx="104" cy="108" r="18" fill="#FFFFFF"/>
  <circle cx="152" cy="108" r="18" fill="#FFFFFF"/>
  <circle cx="128" cy="152" r="18" fill="#FFFFFF"/>
</svg>
