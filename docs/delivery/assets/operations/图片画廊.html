<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PIXIU 操作实拍</title><style>body{font:16px/1.7 sans-serif;max-width:1500px;margin:32px auto;padding:0 24px;background:#f5f7fa;color:#172334}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px}figure{margin:0;background:white;padding:12px;border:1px solid #d0d7df;border-radius:8px}img{width:100%;height:auto}a{color:#165cc0}figcaption{overflow-wrap:anywhere}</style><h1>PIXIU 0.1.9 操作实拍</h1><p>38 张 V11 原始桌面截图，点击查看原图。<a href="截图素材索引.md">操作与未覆盖场景</a> · <a href="截图清单.json">摘要和运行版本</a>。停止状态图记录已发现的问题；设备配对和更新入口不代表完整事务验证通过。</p><main><figure id="S01"><a href="01-图片记录/02-install-result.png"><img loading="lazy" src="01-图片记录/02-install-result.png" alt="安装完成"></a><figcaption><strong>S01 安装完成</strong><p>在终端重装 0.1.9-1，安装退出码为 0。此图记录同版本重装。</p></figcaption></figure><figure id="S02"><a href="01-图片记录/78-command-and-window.png"><img loading="lazy" src="01-图片记录/78-command-and-window.png" alt="命令启动"></a><figcaption><strong>S02 命令启动</strong><p>终端执行 pixiu 后打开唯一主窗口。保留实际图形驱动警告。</p></figcaption></figure><figure id="S03"><a href="01-图片记录/75-menu-launch.png"><img loading="lazy" src="01-图片记录/75-menu-launch.png" alt="应用菜单入口"></a><figcaption><strong>S03 应用菜单入口</strong><p>实际点击 PIXIU 菜单项激活窗口后，重新打开菜单定位入口。</p></figcaption></figure><figure id="S04"><a href="01-图片记录/73-command-window.png"><img loading="lazy" src="01-图片记录/73-command-window.png" alt="新建会话"></a><figcaption><strong>S04 新建会话</strong><p>新会话等待输入，侧栏已收起。</p></figcaption></figure><figure id="S05"><a href="01-图片记录/05-agent-running.png"><img loading="lazy" src="01-图片记录/05-agent-running.png" alt="填写账单任务"></a><figcaption><strong>S05 填写账单任务</strong><p>填写公开合成账单及保存要求，尚未发送。</p></figcaption></figure><figure id="S06"><a href="01-图片记录/06-agent-remember.png"><img loading="lazy" src="01-图片记录/06-agent-remember.png" alt="助手写入记忆"></a><figcaption><strong>S06 助手写入记忆</strong><p>展开已执行的记忆工具；账单合计 434.50 元，后端已接受显式写入。</p></figcaption></figure><figure id="S07"><a href="01-图片记录/16-agent-recall-result.png"><img loading="lazy" src="01-图片记录/16-agent-recall-result.png" alt="跨会话召回"></a><figcaption><strong>S07 跨会话召回</strong><p>另一会话调用记忆检索工具，返回三项金额、合计及知识来源。</p></figcaption></figure><figure id="S08"><a href="01-图片记录/17-agent-source.png"><img loading="lazy" src="01-图片记录/17-agent-source.png" alt="查看助手的记忆来源"></a><figcaption><strong>S08 查看助手的记忆来源</strong><p>从本会话记忆来源选择工具结果，核对保存的账单原文。</p></figcaption></figure><figure id="S09"><a href="01-图片记录/70-task-running.png"><img loading="lazy" src="01-图片记录/70-task-running.png" alt="任务执行中"></a><figcaption><strong>S09 任务执行中</strong><p>终端工具执行 sleep 45，停止按钮可用。</p></figcaption></figure><figure id="S10"><a href="01-图片记录/72-task-stop-result.png"><img loading="lazy" src="01-图片记录/72-task-stop-result.png" alt="停止后的界面问题"></a><figcaption><strong>S10 停止后的界面问题</strong><p>停止后后台记录 Command interrupted、退出码 130；界面仍同时显示已完成与进行中，作为问题证据保留。</p></figcaption></figure><figure id="S11"><a href="01-图片记录/10-memory-input.png"><img loading="lazy" src="01-图片记录/10-memory-input.png" alt="填写手动记忆"></a><figcaption><strong>S11 填写手动记忆</strong><p>输入演示账单标题、正文并选择 Agent 记忆范围。</p></figcaption></figure><figure id="S12"><a href="01-图片记录/11-memory-saved.png"><img loading="lazy" src="01-图片记录/11-memory-saved.png" alt="手动保存结果"></a><figcaption><strong>S12 手动保存结果</strong><p>后端接受写入后显示回执，输入框清空。</p></figcaption></figure><figure id="S13"><a href="01-图片记录/12-memory-evidence.png"><img loading="lazy" src="01-图片记录/12-memory-evidence.png" alt="检索与原文阅读"></a><figcaption><strong>S13 检索与原文阅读</strong><p>检索演示账单并打开来源，核对正文和使用范围。</p></figcaption></figure><figure id="S14"><a href="01-图片记录/13-memory-raw.png"><img loading="lazy" src="01-图片记录/13-memory-raw.png" alt="查看原始数据"></a><figcaption><strong>S14 查看原始数据</strong><p>展开高级原始数据，阅读实际证据结构。</p></figcaption></figure><figure id="S15"><a href="01-图片记录/14-memory-edit.png"><img loading="lazy" src="01-图片记录/14-memory-edit.png" alt="修改账单正文"></a><figcaption><strong>S15 修改账单正文</strong><p>将演示燃气费改为 186 元，合计改为 464.50 元。</p></figcaption></figure><figure id="S16"><a href="01-图片记录/15-memory-version.png"><img loading="lazy" src="01-图片记录/15-memory-version.png" alt="读取更新后的版本"></a><figcaption><strong>S16 读取更新后的版本</strong><p>保存后重新读取，确认版本 2 和修改后的金额。</p></figcaption></figure><figure id="S17"><a href="01-图片记录/64-edit-version-conflict.png"><img loading="lazy" src="01-图片记录/64-edit-version-conflict.png" alt="版本冲突保留输入"></a><figcaption><strong>S17 版本冲突保留输入</strong><p>编辑窗口保持版本 2；通过公共 API 更新同一演示记录至版本 3，再保存旧编辑，实际返回 VERSION_CONFLICT。此场景为受控并发检查。</p></figcaption></figure><figure id="S18"><a href="01-图片记录/65-reload-confirm.png"><img loading="lazy" src="01-图片记录/65-reload-confirm.png" alt="重新读取前确认"></a><figcaption><strong>S18 重新读取前确认</strong><p>重新读取会替换编辑内容，界面先显示确认提示。</p></figcaption></figure><figure id="S19"><a href="01-图片记录/25-forget-target.png"><img loading="lazy" src="01-图片记录/25-forget-target.png" alt="预览遗忘目标"></a><figcaption><strong>S19 预览遗忘目标</strong><p>在独立演示范围预览，只命中本次创建的一条临时便笺。</p></figcaption></figure><figure id="S20"><a href="01-图片记录/26-forget-cancel-ready.png"><img loading="lazy" src="01-图片记录/26-forget-cancel-ready.png" alt="取消遗忘预览"></a><figcaption><strong>S20 取消遗忘预览</strong><p>取消后目标清空，界面说明未发送遗忘确认。</p></figcaption></figure><figure id="S21"><a href="01-图片记录/27-forget-complete.png"><img loading="lazy" src="01-图片记录/27-forget-complete.png" alt="确认遗忘结果"></a><figcaption><strong>S21 确认遗忘结果</strong><p>重新预览同一便笺后点击确认，后端确认遗忘 1 条知识。跨设备送达未验证。</p></figcaption></figure><figure id="S22"><a href="01-图片记录/30-privacy-enabled.png"><img loading="lazy" src="01-图片记录/30-privacy-enabled.png" alt="保存目录采集配置"></a><figcaption><strong>S22 保存目录采集配置</strong><p>启用目录采集，仅指定公开演示目录，行为采集关闭。</p></figcaption></figure><figure id="S23"><a href="01-图片记录/32-capture-log.png"><img loading="lazy" src="01-图片记录/32-capture-log.png" alt="查看真实采集日志"></a><figcaption><strong>S23 查看真实采集日志</strong><p>在演示目录创建文本文件，刷新日志确认实际入库记录。</p></figcaption></figure><figure id="S24"><a href="01-图片记录/33-capture-disabled.png"><img loading="lazy" src="01-图片记录/33-capture-disabled.png" alt="暂停自动采集"></a><figcaption><strong>S24 暂停自动采集</strong><p>关闭总开关并保存，日志显示监控已暂停。</p></figcaption></figure><figure id="S25"><a href="01-图片记录/34-file-source.png"><img loading="lazy" src="01-图片记录/34-file-source.png" alt="查看文件来源"></a><figcaption><strong>S25 查看文件来源</strong><p>检索刚采集的文本，查看采集路径、UTC 时间和原文。</p></figcaption></figure><figure id="S26"><a href="01-图片记录/40-device-status.png"><img loading="lazy" src="01-图片记录/40-device-status.png" alt="读取设备状态"></a><figcaption><strong>S26 读取设备状态</strong><p>当前只有本机节点，同步网络关闭，未收到附近广播。此图不证明多设备同步成功。</p></figcaption></figure><figure id="S27"><a href="01-图片记录/41-pair-dialog.png"><img loading="lazy" src="01-图片记录/41-pair-dialog.png" alt="设备配对入口"></a><figcaption><strong>S27 设备配对入口</strong><p>展示 PIN 配对步骤，尚未生成令牌，画面没有有效令牌或 PIN。</p></figcaption></figure><figure id="S28"><a href="01-图片记录/50-service-version.png"><img loading="lazy" src="01-图片记录/50-service-version.png" alt="核对服务和版本"></a><figcaption><strong>S28 核对服务和版本</strong><p>桌面与后端均为 0.1.9，API 0.5.0、数据库 13，两个 SDK 实际使用 kylin。</p></figcaption></figure><figure id="S29"><a href="01-图片记录/51-update-check.png"><img loading="lazy" src="01-图片记录/51-update-check.png" alt="检查软件更新"></a><figcaption><strong>S29 检查软件更新</strong><p>实际检查返回 0.1.9 已是最新版本。没有执行新版本升级或回滚。</p></figcaption></figure><figure id="S30"><a href="01-图片记录/52-settings-light.png"><img loading="lazy" src="01-图片记录/52-settings-light.png" alt="浅色主题与连接设置"></a><figcaption><strong>S30 浅色主题与连接设置</strong><p>查看浅色主题和本机 Runtime 服务地址。</p></figcaption></figure><figure id="S31"><a href="01-图片记录/55-dark-ready.png"><img loading="lazy" src="01-图片记录/55-dark-ready.png" alt="深色主题"></a><figcaption><strong>S31 深色主题</strong><p>实际切换到深色主题后采集，随后恢复浅色。</p></figcaption></figure><figure id="S32"><a href="01-图片记录/54-model-check.png"><img loading="lazy" src="01-图片记录/54-model-check.png" alt="检测系统模型连接"></a><figcaption><strong>S32 检测系统模型连接</strong><p>检测返回麒灵系统云模型可用；未改动用户凭据。</p></figcaption></figure><figure id="S33"><a href="01-图片记录/60-insight-digest.png"><img loading="lazy" src="01-图片记录/60-insight-digest.png" alt="洞察与采集简报"></a><figcaption><strong>S33 洞察与采集简报</strong><p>当天洞察包含演示文件；简报统计当天 3 条目录采集，含此前两条记录。</p></figcaption></figure><figure id="S34"><a href="01-图片记录/61-preference-history.png"><img loading="lazy" src="01-图片记录/61-preference-history.png" alt="提取偏好并查看历史"></a><figcaption><strong>S34 提取偏好并查看历史</strong><p>录入简洁回答要求后提取偏好，查看实际历史版本。</p></figcaption></figure><figure id="S35"><a href="01-图片记录/62-preference-changed.png"><img loading="lazy" src="01-图片记录/62-preference-changed.png" alt="偏好要求发生变化"></a><figcaption><strong>S35 偏好要求发生变化</strong><p>再录入详细回答要求，刷新后版本 3 为 verbose，保留之前 compact 的历史。</p></figcaption></figure><figure id="S36"><a href="01-图片记录/81-long-reader.png"><img loading="lazy" src="01-图片记录/81-long-reader.png" alt="阅读长正文开头"></a><figcaption><strong>S36 阅读长正文开头</strong><p>真实录入十八步演示流程，来源阅读区显示开头并提供滚动条。</p></figcaption></figure><figure id="S37"><a href="01-图片记录/84-long-bottom.png"><img loading="lazy" src="01-图片记录/84-long-bottom.png" alt="阅读长正文末尾"></a><figcaption><strong>S37 阅读长正文末尾</strong><p>向下滚动到第十六至十八步和结束标记，确认末尾可达。</p></figcaption></figure><figure id="S38"><a href="01-图片记录/85-invalid-json.png"><img loading="lazy" src="01-图片记录/85-invalid-json.png" alt="格式错误时禁止保存"></a><figcaption><strong>S38 格式错误时禁止保存</strong><p>高级编辑中缺少 JSON 结束括号，输入保留且保存按钮禁用；未向后端提交。</p></figcaption></figure></main></html>
